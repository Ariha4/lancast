[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lancast"
version = "0.1.0"
description = "UDP peer discovery + TCP file transfer over raw sockets."
requires-python = ">=3.9"
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
lancast = "lancast.cli:main"

[tool.setuptools]
packages = ["lancast"]
